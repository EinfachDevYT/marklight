# /etc/nginx/sites-available/marklight.example.org
# Marklight behind nginx + PHP-FPM, clean URLs, optional GeoIP2 country detection (language).
server {
    listen 80;
    listen [::]:80;
    server_name marklight.example.org;

    root /var/www/marklight-web/public;
    index index.php;

    access_log off;            # Marklight keeps no record of who reads what
    server_tokens off;
    client_max_body_size 64k;

    location ~ /\.                                   { deny all; }
    location ~* \.(bak|swp|orig|map|log|ini|sh|sql)$ { deny all; }

    # Clean URLs: /reader → reader.php
    location / {
        try_files $uri $uri/ @clean;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }
    location @clean {
        rewrite ^/([a-z]+)$ /$1.php last;
        return 404;
    }

    location ~* \.(js|css|svg|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param GEOIP_COUNTRY_CODE $geoip2_country_code;   # remove without GeoIP2
        fastcgi_pass unix:/run/php/marklight.sock;
        fastcgi_hide_header X-Powered-By;
    }
}
