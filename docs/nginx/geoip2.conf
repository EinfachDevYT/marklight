# /etc/nginx/conf.d/geoip2.conf  –  http-level config (loaded once for all sites)
# Country detection for Marklight's default language (German for DE/AT/CH/LI/LU).
# Requires: apt install libnginx-mod-http-geoip2  and  scripts/update-geoip.sh
geoip2 /usr/share/GeoIP/dbip-country-lite.mmdb {
    auto_reload 24h;
    $geoip2_country_code country iso_code;
}

