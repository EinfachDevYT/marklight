; /etc/php/8.4/fpm/pool.d/marklight.conf – dedicated, locked-down PHP pool for Marklight
[marklight]
user = www-data
group = www-data
listen = /run/php/marklight.sock
listen.owner = www-data
listen.group = www-data

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s

php_admin_value[open_basedir] = /var/www/marklight-web:/tmp
php_admin_flag[allow_url_fopen] = off
php_admin_flag[file_uploads] = off
php_admin_flag[display_errors] = off
php_admin_value[post_max_size] = 64K
php_admin_value[max_execution_time] = 15
php_admin_value[memory_limit] = 64M
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
