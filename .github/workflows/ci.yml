name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          coverage: none
      - name: PHP syntax
        run: find src public config tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Security tests
        run: php tests/run.php
      - name: JavaScript syntax
        run: for f in public/assets/js/*.js public/sw.js; do node --check "$f"; done
      - name: Docker build
        run: docker build -t marklight:ci .
