; Marklight – hardened PHP settings. Engineered by EinfachDev.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
allow_url_fopen = Off
allow_url_include = Off
file_uploads = Off
post_max_size = 64K
max_execution_time = 15
memory_limit = 64M
session.auto_start = 0
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,phpinfo
open_basedir = /var/www/marklight:/tmp
