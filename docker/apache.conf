# Marklight – Apache vhost (Docker). Engineered by EinfachDev.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    DocumentRoot /var/www/marklight/public
    <Directory /var/www/marklight/public>
        AllowOverride All
        Require all granted
    </Directory>
    # Only public/ is served – the rest of the project is outside the document root.
    <Directory /var/www/marklight>
        Require all denied
    </Directory>
    # No access logs: Marklight does not record who reads what.
    CustomLog /dev/null common
    ErrorLog /proc/self/fd/2
    LimitRequestBody 65536
</VirtualHost>
